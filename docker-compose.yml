services:
  mongodb:
    image: mongo:7
    container_name: bowls-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro

  web:
    build: .
    container_name: bowls-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongodb:27017
    depends_on:
      - mongodb

volumes:
  mongodb_data: