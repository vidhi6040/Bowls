
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bowls
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bowls
  template:
    metadata:
      labels:
        app: bowls
    spec:
      containers:
        - name: bowls
          image: vidhi2064/bowls-app:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:
            - name: MONGO_URL
              value: "mongodb://host.minikube.internal:27017"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
